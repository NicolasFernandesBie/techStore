services:
  api:
    build:
      context: ./apps/api
    container_name: techstore-api
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/data/techstore.db
      - JWT_SECRET=techstore-dev-secret-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - techstore-data:/data
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  web:
    build:
      context: ./apps/web
    container_name: techstore-web
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_URL=http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  techstore-data:
